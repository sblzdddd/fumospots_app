name: fumo_spots
description: "Upload and find fumo photos around the world!"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.4+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  get_it: ^9.3.0
  maplibre: ^0.3.6
  flutter_secure_storage: ^11.2.0
  synchronized: ^3.5.0
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  json_annotation: ^4.12.0
  google_fonts: ^9.0.0
  flutter_staggered_grid: ^0.1.2
  font_awesome_flutter: ^11.0.0
  flutter_dotenv: ^6.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_svg: ^2.2.3
  material_ui: ">=1.3.0 <1.8.0"
  m3e_core: ^1.1.4
  flutter_floating_bottom_bar: ^3.0.1
  motor: ^1.1.0
  webview_flutter: ^4.14.1
  crypto: ^3.0.7
  image_picker: ^1.2.4
  exif: ^3.3.0
  image_to_webp: ^1.0.0
  geolocator: ^14.1.2
  flutter_image_compress: ^2.5.1
  mime: ^2.1.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/brand/logo.svg
    - assets/brand/logo-dark.svg
    - assets/Chen_W.png
